# Dev media server: mimics Nezden's /media (immutable files, open CORS).
server {
  listen 80;
  location /media/ {
    root /usr/share/nginx/html;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable";
    types { image/webp webp; image/png png; image/jpeg jpg jpeg; image/svg+xml svg; }
  }
}
